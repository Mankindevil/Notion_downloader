<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Chloe von Einzbern — Title Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Serif+JP:wght@700;900&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Kaisei+Opti:wght@400;700&family=Cormorant+Garamond:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Artwork's actual background — sampled from 小黑'.png (hot pink). */
      --art-bg: #f57aba;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--art-bg); }
    body { display: flex; flex-direction: column; gap: 24px; padding: 24px; align-items: center; min-height: 100vh; }

    .card {
      width: 620px;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      padding: 52px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ── A — Bubbly Kawaii (white text + hard crimson shadow) ─────── */
    .a-furi  { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.55em; color: rgba(255,255,255,0.95); margin-bottom: 8px; text-shadow: 2px 2px 0 #8c1450; }
    .a-main  { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 5.2rem; color: #fff; letter-spacing: 0.04em; text-shadow: 5px 6px 0 #b81c66, 8px 11px 0 rgba(74,12,32,0.7); line-height: 1; font-style: italic; }
    .a-kata  { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 1.7rem; color: #fff; letter-spacing: 0.32em; text-shadow: 3px 4px 0 #b81c66; margin-top: 14px; }
    .a-en    { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.42em; color: rgba(255,255,255,0.95); margin-top: 18px; text-transform: uppercase; text-shadow: 2px 2px 0 #8c1450; }
    .a-hearts{ display: flex; gap: 14px; margin-top: 18px; font-size: 1.35rem; color: #fff; opacity: 0.95; text-shadow: 2px 2px 0 #8c1450; }

    /* ── B — Elegant Serif (white serif + gold accents + soft glow) ── */
    .b-top-rule, .b-bottom-rule { width: 78%; display: flex; align-items: center; gap: 12px; }
    .b-top-rule    { margin-bottom: 18px; }
    .b-bottom-rule { margin-top: 18px; }
    .b-top-rule span, .b-bottom-rule span { flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, #ffd86b, transparent); }
    .b-top-rule i, .b-bottom-rule i { color: #ffd86b; font-style: normal; font-size: 1.1rem; text-shadow: 0 0 8px rgba(255,200,90,0.7); }
    .b-furi    { font-family: 'Noto Serif JP', serif; font-size: 0.88rem; letter-spacing: 0.55em; color: rgba(255,255,255,0.98); margin-bottom: 10px; text-shadow: 0 2px 8px rgba(140,20,80,0.7); }
    .b-main    { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-style: italic; font-size: 5.8rem; color: #fff; letter-spacing: 0.02em; line-height: 1; text-shadow: 0 2px 14px rgba(255,255,255,0.5), 0 4px 22px rgba(74,12,32,0.7); }
    .b-divider { width: 90px; height: 1px; background: linear-gradient(90deg, transparent, #ffd86b, transparent); margin: 18px auto; }
    .b-kata    { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 1.5rem; letter-spacing: 0.45em; color: #fff; text-shadow: 0 2px 10px rgba(140,20,80,0.6); }
    .b-en      { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; letter-spacing: 0.32em; color: #ffd86b; margin-top: 14px; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,200,90,0.55), 0 2px 6px rgba(74,12,32,0.5); }

    /* ── C — Pop Outline Sticker (badge + thick stroke + hard shadow) ─ */
    .c-badge   { background: #fff; border-radius: 100px; padding: 5px 24px 6px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.42em; color: #c41e6e; box-shadow: 0 4px 0 #4a0c20; margin-bottom: 22px; }
    .c-main    { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 5.6rem; color: #fff; letter-spacing: 0.04em; -webkit-text-stroke: 5px #c41e6e; paint-order: stroke fill; text-shadow: 6px 8px 0 #2a1018; line-height: 1; font-style: italic; }
    .c-kata    { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 2.4rem; color: #fff; -webkit-text-stroke: 3px #c41e6e; paint-order: stroke fill; text-shadow: 4px 6px 0 #2a1018; letter-spacing: 0.34em; margin-top: 14px; }
    .c-furi    { font-family: 'Zen Maru Gothic', sans-serif; font-size: 0.86rem; font-weight: 700; letter-spacing: 0.36em; color: #fff; margin-top: 18px; text-shadow: 2px 2px 0 #c41e6e, 3px 3px 0 #2a1018; }
    .c-deco    { margin-top: 14px; font-size: 1.5rem; letter-spacing: 0.32em; color: #ffd86b; text-shadow: 2px 2px 0 #c41e6e, 3px 3px 0 #2a1018; }

    /* ── D — Soft Dreamy (multi-layer glow + faint dark shadow) ────── */
    .d-star-row { display: flex; gap: 10px; font-size: 1rem; color: #ffd86b; letter-spacing: 0.18em; margin-bottom: 20px; opacity: 0.95; text-shadow: 0 0 10px rgba(255,200,90,0.7); }
    .d-furi     { font-family: 'Noto Serif JP', serif; font-size: 0.85rem; letter-spacing: 0.6em; color: rgba(255,255,255,0.95); margin-bottom: 6px; text-shadow: 0 0 12px rgba(255,255,255,0.55), 0 2px 6px rgba(74,12,32,0.5); }
    .d-main     { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-style: italic; font-size: 5.4rem; letter-spacing: 0.02em; color: #fff; line-height: 1; text-shadow: 0 0 22px rgba(255,255,255,0.75), 0 0 42px rgba(255,216,107,0.55), 0 3px 6px rgba(74,12,32,0.55); }
    .d-line     { width: 130px; height: 1.5px; background: linear-gradient(90deg, transparent, #ffd86b, transparent); margin: 18px auto; }
    .d-kata     { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 1.5rem; letter-spacing: 0.55em; color: #fff; text-shadow: 0 0 16px rgba(255,255,255,0.55), 0 2px 8px rgba(74,12,32,0.5); }
    .d-en       { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.05rem; letter-spacing: 0.3em; color: #ffd86b; margin-top: 16px; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,200,90,0.55), 0 2px 4px rgba(74,12,32,0.4); }
    .d-star-row-b { margin-top: 20px; margin-bottom: 0; }
  </style>
</head>
<body>

  <!-- A — Bubbly Kawaii — playful, hard crimson shadow does the readability work -->
  <div class="card card-a" id="card-a">
    <div class="a-furi">フォン・アインツベルン</div>
    <div class="a-main">Chloe</div>
    <div class="a-kata">クロエ</div>
    <div class="a-en">Chloe von Einzbern</div>
    <div class="a-hearts">♡ ♥ ♡</div>
  </div>

  <!-- B — Elegant Serif — white + gold, soft glow against pink -->
  <div class="card card-b" id="card-b">
    <div class="b-top-rule"><span></span><i>✦</i><span></span></div>
    <div class="b-furi">クロエ・フォン・アインツベルン</div>
    <div class="b-main">Chloe</div>
    <div class="b-divider"></div>
    <div class="b-kata">von Einzbern</div>
    <div class="b-en">Chloe von Einzbern</div>
    <div class="b-bottom-rule"><span></span><i>✦</i><span></span></div>
  </div>

  <!-- C — Pop Outline Sticker — thick pink stroke + black hard shadow, edgy -->
  <div class="card card-c" id="card-c">
    <div class="c-badge">EINZBERN</div>
    <div class="c-main">CHLOE</div>
    <div class="c-kata">クロエ</div>
    <div class="c-furi">フォン・アインツベルン &nbsp;·&nbsp; VON EINZBERN</div>
    <div class="c-deco">★ ☆ ★</div>
  </div>

  <!-- D — Soft Dreamy — glowing serif with gold accents, ethereal -->
  <div class="card card-d" id="card-d">
    <div class="d-star-row">✦ &nbsp; ✦ &nbsp; ✦ &nbsp; ✦ &nbsp; ✦</div>
    <div class="d-furi">クロエ・フォン・アインツベルン</div>
    <div class="d-main">Chloe</div>
    <div class="d-line"></div>
    <div class="d-kata">von Einzbern</div>
    <div class="d-en">Chloe von Einzbern</div>
    <div class="d-star-row d-star-row-b">✦ &nbsp; ✦ &nbsp; ✦ &nbsp; ✦ &nbsp; ✦</div>
  </div>

</body>
</html>

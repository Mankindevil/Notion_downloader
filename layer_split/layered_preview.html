<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>フリーレン 立体画 5层视差预览</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0e14; color: #cfd6df;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 1400px;
  }
  .scene {
    position: relative;
    width: min(90vw, calc(90vh * (2432/1664)));
    aspect-ratio: 2432 / 1664;
    transform-style: preserve-3d;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    border-radius: 8px;
    overflow: hidden;
    background: #6ab4e8;
    transition: transform 0.05s linear;
  }
  .layer {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    will-change: transform;
    transition: transform 0.08s linear;
  }
  .l1 { background-image: url('layers_output/1_sky.png');   z-index: 1; }
  .l2 { background-image: url('layers_output/2_cloud.png'); z-index: 2; }
  .l3 { background-image: url('layers_output/3_body.png');  z-index: 3; }
  .l4 { background-image: url('layers_output/4_hair.png');  z-index: 4; }
  .l5 { background-image: url('layers_output/5_face.png');  z-index: 5; }

  .hud {
    position: fixed; left: 16px; top: 14px;
    background: rgba(12,16,22,0.78); backdrop-filter: blur(6px);
    border: 1px solid #1d2733; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; line-height: 1.55;
    min-width: 230px;
  }
  .hud h1 { margin: 0 0 6px; font-size: 14px; color: #fff; font-weight: 600; }
  .hud .row { display: flex; justify-content: space-between; gap: 10px; }
  .hud .row span:last-child { color: #8fb6e2; font-variant-numeric: tabular-nums; }
  .hud .tip { margin-top: 8px; color: #6f7a87; font-size: 12px; }
  .hud .toggle { margin-top: 8px; }
  .hud label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .hud input[type=range] { width: 100%; }

  .legend {
    position: fixed; right: 16px; top: 14px;
    background: rgba(12,16,22,0.78); border: 1px solid #1d2733;
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px;
  }
  .legend .item { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; }
  .d1 { background: #6ab4e8; } .d2 { background: #e6efff; }
  .d3 { background: #5b6c8a; } .d4 { background: #c4d2e6; }
  .d5 { background: #f0d4c2; }
</style>
</head>
<body>
  <div class="stage">
    <div class="scene" id="scene">
      <div class="layer l1"></div>
      <div class="layer l2"></div>
      <div class="layer l3"></div>
      <div class="layer l4"></div>
      <div class="layer l5"></div>
    </div>
  </div>

  <div class="hud">
    <h1>フリーレン · 5层立体画</h1>
    <div class="row"><span>视差强度</span><span id="strengthVal">1.0×</span></div>
    <input type="range" id="strength" min="0" max="3" step="0.05" value="1">
    <div class="row toggle"><label><input type="checkbox" id="tiltScene" checked> 场景倾斜</label></div>
    <div class="tip">鼠标移动 / 触屏滑动 → 各层按深度位移</div>
  </div>

  <div class="legend">
    <div class="item"><div class="dot d1"></div>L1 天空</div>
    <div class="item"><div class="dot d2"></div>L2 云</div>
    <div class="item"><div class="dot d3"></div>L3 身体</div>
    <div class="item"><div class="dot d4"></div>L4 头发</div>
    <div class="item"><div class="dot d5"></div>L5 脸部 (前景)</div>
  </div>

<script>
  // Per-layer parallax offset multipliers (in % of scene size). Back = small, front = big.
  const OFFSETS = [0.4, 1.4, 2.8, 4.2, 5.6]; // l1..l5
  const layers = [...document.querySelectorAll('.layer')];
  const scene = document.getElementById('scene');
  const strengthEl = document.getElementById('strength');
  const strengthLabel = document.getElementById('strengthVal');
  const tiltEl = document.getElementById('tiltScene');

  let mx = 0, my = 0;       // -1..1 normalized
  let tmx = 0, tmy = 0;     // smoothed target

  function onPointer(clientX, clientY) {
    const w = window.innerWidth, h = window.innerHeight;
    tmx = (clientX / w) * 2 - 1;
    tmy = (clientY / h) * 2 - 1;
  }
  window.addEventListener('mousemove', e => onPointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if (e.touches.length) onPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  strengthEl.addEventListener('input', () => {
    strengthLabel.textContent = (+strengthEl.value).toFixed(2) + '×';
  });

  function tick() {
    // Lerp toward target for smoother motion
    mx += (tmx - mx) * 0.12;
    my += (tmy - my) * 0.12;
    const s = +strengthEl.value;

    layers.forEach((el, i) => {
      const k = OFFSETS[i] * s;
      el.style.transform = `translate3d(${-mx * k}%, ${-my * k}%, 0) scale(${1 + k/100})`;
    });

    if (tiltEl.checked) {
      const rx = my * 4;   // tilt up/down (deg)
      const ry = -mx * 6;  // tilt left/right (deg)
      scene.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    } else {
      scene.style.transform = 'none';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
